name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test:scripts
      - run: bun run check:example
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-node:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: node --test test/smoke.mjs test/lifecycle.mjs test/expo.mjs test/ports.mjs
      - run: node test/example.mjs
      - run: python3 test/ui.py node

  test-bun:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.4.2", latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: bun test --timeout 10000 test/smoke.test.mjs test/lifecycle.test.mjs test/expo.test.mjs test/ports.test.mjs
      - run: bun test/example.mjs
      - run: python3 test/ui.py bun

  test-package-managers:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package-manager: [bun, npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm install --global yarn@1.22.22
        if: matrix.package-manager == 'yarn'
      - run: npm install --global pnpm@10
        if: matrix.package-manager == 'pnpm'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: bun run test:package-managers
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}

  test-deno:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        deno-version: [v2.1.5, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: deno test -A test/smoke.mjs test/lifecycle.mjs test/expo.mjs test/ports.mjs
      - run: deno run -A test/example.mjs
      - run: python3 test/ui.py deno
